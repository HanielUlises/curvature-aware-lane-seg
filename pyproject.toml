[project]
name = "curvature-aware-lane-seg"
version = "0.0.0"
description = "Curvature-aware lane segmentation for downstream control."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pytorch-lightning>=2.1",
    "albumentations>=1.4",
    "segmentation-models-pytorch>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
download = ["gdown>=5.0"]

[tool.pytest.ini_options]

testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

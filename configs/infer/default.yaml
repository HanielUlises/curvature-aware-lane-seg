# Qualitative inference: overlay predicted lane masks on validation frames and
# encode a video that sweeps from straight to tight-curve (ordered by curvature).
ckpt: null          # path to a .ckpt; null -> best checkpoint under the latest run
n_frames: 120       # frames to render into the video
fps: 6
order: curvature    # curvature (straight->curvy) | random
show_gt: true       # overlay ground-truth contour for comparison
threshold: 0.5
out_dir: null       # null -> <run_dir>/inference
seed: ${seed}
# Held-out inference (scripts.infer_images): sample valid-split frames NOT in the
# eval manifest -> genuinely unseen by training and checkpoint selection.
unseen_n: 250       # frames to score for the generalization metric
unseen_video: 60    # subset of those rendered into the video
# Sequence inference (scripts.infer_sequence): a directory of ordered frames
# (e.g. a TuSimple clip) or a video file -> one consistent output video.
source: null        # path to an image dir (single clip or a parent of clips) or a video
tta: true           # horizontal-flip test-time augmentation (safe IoU boost)
max_frames: null    # cap total frames (null = all); e.g. 300 for a ~30s montage
# Also write each composed frame as PNG (scripts.viz_control). Build GIFs from these
# rather than from the mp4, so the result does not carry the video codec's artifacts.
dump_frames: false
# Track the ego lane's two boundaries across frames instead of re-deriving them from
# each mask independently (scripts.viz_control). Only meaningful on a genuinely
# consecutive sequence; leave it off for the curvature-ordered montage, whose frames
# come from unrelated scenes.
track_ego_lane: true
track_alpha: 0.60        # weight on the new observation; lower is steadier but drifts
track_gate_px: 80.0      # displacement beyond which a boundary is a different one
track_max_coast: 1       # frames a row may be carried with no observation
# Render from the deployed C++ chain instead of the Python reference (scripts.viz_control).
# Same geometry either way; this shows what the vehicle would compute.
native: false
speed_mps: 15.0

defaults:
  - data: curvelanes
  - subset: default
  - _self_

seed: 42

paths:
  # data_root resolves through the data/raw symlink to the external disk.
  data_root: data/raw/Curvelanes
  # Prepared artifacts (manifests + cached masks) live next to the raw data,
  # i.e. on the external disk, not the root filesystem.
  output_root: data/raw/prepared

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
